[project]
name = "robothand-sim"
version = "0.1.0"
description = "Five-finger robot hand (Shadow Hand, BrainCo Revo 2) + tweezers bean transfer simulation in MuJoCo"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "mujoco>=3.15.0",
    "numpy>=2.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robothand_sim"]
